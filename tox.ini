[tox]
# The declarations are Python 3 syntax, so the Pythons here are the ones
# `requires-python` names and no others: a `python2.7` cell could not have run
# this package's source and reported a pass by running something else.
envlist=typecheck,py314,py313,py312,py311,py310,py39
skip_missing_interpreters = True

# Which of those a GitHub runner's interpreter runs, read by `tox-gh`. The
# matrix in `.github/workflows/test.yml` chooses the interpreters; this chooses
# what each one does, so the CI run and a developer's `tox` are the same
# commands against the same dependency list. `typecheck` rides on one row
# rather than five: mypy reads the source, and the answer does not vary by
# interpreter.
[gh]
python =
    3.10 = py310
    3.11 = py311
    3.12 = typecheck, py312
    3.13 = py313
    3.14 = py314

[testenv]
passenv =
    LANG
    LANGUAGE
    DISPLAY
    HOME
    USER
deps=-r{toxinidir}/test-requirements.txt
usedevelop=true
commands=pytest --cov=pydispatch --no-cov-on-fail --cov-report=term-missing {posargs:tests}

# What this package declares, checked as a consumer's checker reads it.  In
# `envlist`: a gate nothing runs is a gate that stops being true.
[testenv:typecheck]
skip_install = true
deps =
    mypy
commands = mypy
