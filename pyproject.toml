[project]
name="PyDispatcher"
description="Multi-producer multi-consumer in-memory signal dispatch system"
dynamic=["version"]
keywords=["dispatcher", "dispatch", "pydispatch", "event", "signal", "sender", "receiver", "propagate", "multi-consumer", "multi-producer", "saferef", "robustapply", "apply"]
authors = [
    { name = "Patrick K. O'Brien" }
]
maintainers = [
    { name = "Mike C. Fletcher", email = "mcfletch@vrplumber.com" }
]
requires-python = ">=3.9"
classifiers = [
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Intended Audience :: Developers",
]
readme = {file="README.md", content-type="text/markdown"}
license ={text= "BSD"}

[project.optional-dependencies]
dev = [
    "tox",
]

[build-system]
requires = ["setuptools>=40.8.0", "wheel"]

[tool.setuptools.dynamic]
version = {attr = "pydispatch.__version__"}

# uv decides whether its cached metadata for a source tree is still current
# from pyproject.toml, setup.py and setup.cfg alone. This project's version
# lives in pydispatch/__init__.py, so name that file too: without it a version
# bump leaves uv answering with the previous number, and a dependent requiring
# the new one resolves against PyPI rather than this checkout.
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "pydispatch/__init__.py" }]

# The workspace's E/W/F/B base. This is a twenty-year-old codebase and the star
# imports in its tests are how they have always been written, so they are
# allowed rather than churned out -- the rule the workspace states for old code.
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "B"]
ignore = [
    "E501",  # long lines, kept readable by hand rather than hard-wrapped
    "E741",  # ambiguous name -- `l` reads naturally in this code
]

[tool.ruff.lint.per-file-ignores]
# The tests import the API under test wholesale, which is what they are testing
# the shape of.
"tests/*" = ["F403", "F405"]

[tool.mypy]
# Named here so that `mypy` with no arguments checks the package: the tox
# environment and a developer's bare `mypy` are then the same run.
files = ["pydispatch"]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "silent"
# Every definition states its types, and a body is checked rather than skipped.
# This package is under everything else here, so what it declares is what a
# checker reads about every signal a program connects and sends.
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
